name: Terraform CI & Security

on:
  pull_request:
    paths:
      - "terraform/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform-ci:
    name: Terraform CI & Security
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true

    steps:
      # 1. Checkout repository with full Git history for secret scanning
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Inject SSH Public Key
        working-directory: ./terraform
        run: echo "${{ secrets.VM_SSH_PUB_KEY }}" > id_rsa.pub

      # 2. Scan repository for accidentally committed secrets
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Check Terraform formatting
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # 5. Initialize Terraform without configuring remote state
      - name: Terraform Init
        run: terraform init

      # 6. Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # 7. Install Checkov
      - name: Install Checkov
        run: pip install checkov

      # 8. Scan Terraform code for security issues
      - name: Run Checkov
        run: checkov -d .

      # 9. Generate Terraform plan
      # Continue temporarily so the plan result can be reported to the PR
      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan-output.txt
          exit ${PIPESTATUS[0]}

      # 10. Post Terraform Plan result to the Pull Request
      - name: Comment PR with Terraform Plan
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let planOutput = 'Terraform plan output was not generated.';

            const planFile = 'terraform/plan-output.txt';

            if (fs.existsSync(planFile)) {
              planOutput = fs.readFileSync(planFile, 'utf8');
            }

            // Prevent an excessively large PR comment
            const maxLength = 60000;

            if (planOutput.length > maxLength) {
              planOutput =
                planOutput.substring(0, maxLength) +
                '\n\n... Plan output truncated.';
            }

            const outcome = process.env.PLAN_OUTCOME;

            const output = `## Terraform Plan 📖

            **Status:** \`${outcome}\`

            <details>
            <summary>Show Plan Details</summary>

            \`\`\`terraform
            ${planOutput}
            \`\`\`

            </details>

            _Generated automatically by Terraform CI._`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # 11. Restore the Terraform Plan failure status
      # This allows the PR to receive the diagnostic comment
      # while still preventing a broken PR from passing CI.
      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: |
          echo "Terraform plan failed."
          exit 1